name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-build-secret-0123456789abcdef0123456789
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/ng_hiphop?sslmode=require
          ADMIN_RESET_SECRET: test-reset-secret

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit dependencies
        # Production dependencies only: the full dependency tree reports
        # dev-only advisories in the ESLint toolchain (braces → micromatch →
        # fast-glob → eslint-config-next) that have no patched release —
        # npm's only proposed fix is a breaking eslint-config-next downgrade.
        # Dev dependencies never ship to production, so the release gate
        # audits what production actually installs (npm audit --omit=dev).
        run: npm audit --omit=dev --audit-level=moderate
