name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real secrets are provided at deploy time.
          DATABASE_URL: "file:./prisma/dev.db"
          NEXTAUTH_SECRET: "ci-placeholder-secret-not-for-production"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "ci-placeholder-password"
